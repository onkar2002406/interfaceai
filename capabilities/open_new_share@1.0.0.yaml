    surfaceKind: web
    traceRef: evidence/runs/discovery-e6e0963c/trace.json
    traceSha256: 6735cba72fab87570b228f36dba0d2c1bf16f7df1c547c8ab7e6daf1cb704240
    handCompleted: "step s9 (Open Share) was authored by a person, not recorded: policy refuses
      irreversible actions during discovery, so the agent recorded up to the review screen and
      stopped. See scripts/complete-posting-steps.ts."
spec:
  inputs:
    - name: memberId
      type: string
      description: Enter member number {{memberId}} into the Value textbox for member search.
      required: true
      pattern: ^[0-9]{1,9}$
      sensitivity: pii
    - name: shareType
      type: string
      description: Select {{shareType}} - Money Market in the Share Type dropdown.
      required: true
      pattern: ^.{1,40}$
      sensitivity: pii
    - name: deposit
      type: string
      description: Enter the initial deposit amount of {{deposit}} into the Initial Deposit textbox.
      required: true
      pattern: ^[0-9]+(\.[0-9]{1,2})?$
      sensitivity: pii
  outputs:
    - name: shareType
      type: string
      description: Share Type displayed on confirmation screen
      sensitivity: pii
      from:
        afterStep: s8
        target:
          description: the shareType value on the final screen
          role: StaticText
          nameMatch: normalized
          scope:
            framePath:
              - main
            heading: CONFIRM NEW SHARE
          anchors:
            - relation: proximateLabel
              text: Share Type
            - relation: nearHeading
              text: CONFIRM NEW SHARE
          hints:
            boundsAtRecord:
              x: 390.640625
              y: 134
              width: 125
              height: 13
            proximateLabels:
              - Share Type
        transform: trim
    - name: initialDeposit
      type: money
      description: Initial Deposit displayed on confirmation screen
      sensitivity: pii
      from:
        afterStep: s8
        target:
          description: the initialDeposit value on the final screen
