# Open a new share on a member record
#
# Opens a {{shareType}} share on member {{memberId}} with an initial deposit of {{deposit}}, reviewing it and then CREATING it. The creating step is irreversible and requires explicit authorisation; without it the run stops for a human at the confirmation screen having created nothing.
#
# Reviewed by a human before `approval: approved` is set. Approval is what
# permits unattended replay of any step marked risk: irreversible.
#
# Values below are parameter REFERENCES ({{name}}), never captured data.

apiVersion: capability.interface.ai/v1
kind: Capability
metadata:
  id: cap_open_new_share
  name: open_new_share
  version: 1.0.0
  title: Open a new share on a member record
  summary: Opens a {{shareType}} share on member {{memberId}} with an initial deposit of {{deposit}},
    reviewing it and then CREATING it. The creating step is irreversible and requires explicit
    authorisation; without it the run stops for a human at the confirmation screen having created
    nothing.
  createdAt: 2026-09-05T13:45:55.050Z
  app:
    product: meridian-core
    productVersion: 4.2.1
    tenant: meridian
    entryPoint: /
  approval: draft
  provenance:
    discoveryRunId: e6e0963c
