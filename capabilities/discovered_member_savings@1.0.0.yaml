              height: 13
      guard:
        risk: safe
      conditions: []
      optional: false
    - id: s4
      intent: Submit the search and land on the member's detail screen.
      action:
        type: click
        target:
          description: Submit the search and land on the member's detail screen.
          role: button
          name: Search
          nameMatch: normalized
          scope:
            framePath:
              - main
              - contentFrame
          anchors: []
          hints:
