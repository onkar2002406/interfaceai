          description: the savingsBalance value on the final screen
          role: cell
          nameMatch: normalized
          scope:
            framePath:
              - main
              - contentFrame
          anchors:
            - relation: underColumn
              text: Current Balance
            - relation: inRowWith
              text: Savings
          hints: {}
        transform: money
  preconditions:
