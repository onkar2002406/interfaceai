# Update a member's contact details
#
# Updates the e-mail, phone and mailing address on member {{memberId}} and saves the record. The mailing address REPLACES what is on file rather than appending to it, so a caller that does not have the full address should read the record first.
#
# Reviewed by a human before `approval: approved` is set. Approval is what
# permits unattended replay of any step marked risk: irreversible.
#
# Values below are parameter REFERENCES ({{name}}), never captured data.

