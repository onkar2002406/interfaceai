              x: 401.46875
              y: 215
              width: 49.15625
              height: 13
      guard:
        risk: safe
      checkpoint:
        describe: the route matches /members/[0-9]+/hold/review(?:[?#]|$) and "CONFIRM ACCOUNT HOLD" is on
          screen
        all:
          - kind: urlMatches
            pattern: /members/[0-9]+/hold/review(?:[?#]|$)
