# Place a hold on a member share
#
# Places a {{reason}} hold on share {{shareId}} of member {{memberId}}, annotated with {{notes}}, reviewing it and then APPLYING it. Restricted to supervisors — a teller receives SUPERVISOR_OVERRIDE_REQUIRED. The applying step is irreversible and requires explicit authorisation; without it the run stops for a human having applied nothing.
#
# Reviewed by a human before `approval: approved` is set. Approval is what
# permits unattended replay of any step marked risk: irreversible.
#
# Values below are parameter REFERENCES ({{name}}), never captured data.

apiVersion: capability.interface.ai/v1
kind: Capability
metadata:
  id: cap_place_account_hold
  name: place_account_hold
  version: 1.0.0
  title: Place a hold on a member share
  summary: Places a {{reason}} hold on share {{shareId}} of member {{memberId}}, annotated with
    {{notes}}, reviewing it and then APPLYING it. Restricted to supervisors — a teller receives
    SUPERVISOR_OVERRIDE_REQUIRED. The applying step is irreversible and requires explicit
    authorisation; without it the run stops for a human having applied nothing.
  createdAt: 2026-09-05T13:50:53.255Z
  app:
    product: meridian-core
    productVersion: 4.2.1
    tenant: meridian
    entryPoint: /
  approval: draft
  provenance:
    discoveryRunId: d26480a5
    model: groq:openai/gpt-oss-120b
    surfaceKind: web
    traceRef: evidence/runs/discovery-d26480a5/trace.json
    traceSha256: 7bdf24014883dbd27c253eee40c035a0bd0eed5b777ffa4e19c606d3d13f9bf3
    handCompleted: "step s9 (Apply Hold) was authored by a person, not recorded: policy refuses
      irreversible actions during discovery, so the agent recorded up to the review screen and
      stopped. See scripts/complete-posting-steps.ts. step s7a (Notes) was authored by a person, not
      recorded: the discovery goal did not mention this field, so the model never typed into it. The
      control is on MERIDIAN's own screen. See scripts/add-form-fields.ts."
spec:
  inputs:
    - name: memberId
      type: string
      description: Type the member number {{memberId}} into the Value textbox to search for the member.
      required: true
      pattern: ^[0-9]{1,9}$
      sensitivity: pii
    - name: shareId
      type: string
      description: Select the share '{{shareId}} - Money Market' from the Share dropdown.
      required: true
      pattern: ^.{1,40}$
      sensitivity: pii
    - name: reason
      type: string
      description: Select {{reason}} in the Reason dropdown as required.
      required: true
      pattern: ^.{1,40}$
      sensitivity: pii
    - name: notes
      type: string
      description: Free-text note explaining the hold, 120 characters or fewer.
      required: true
      pattern: ^.{1,120}$
      sensitivity: pii
  outputs:
    - name: share
      type: string
      description: Share displayed on confirmation screen
      sensitivity: pii
      from:
        afterStep: s8
        target:
          description: the share value on the final screen
          role: StaticText
          nameMatch: normalized
          scope:
            framePath:
              - main
            heading: CONFIRM ACCOUNT HOLD
          anchors:
            - relation: proximateLabel
              text: Share
            - relation: nearHeading
              text: CONFIRM ACCOUNT HOLD
          hints:
            boundsAtRecord:
              x: 352.265625
              y: 160
              width: 190
              height: 13
            proximateLabels:
              - Share
        transform: trim
    - name: reason
      type: string
      description: Reason displayed on confirmation screen
      sensitivity: pii
      from:
        afterStep: s8
        target:
          description: the reason value on the final screen
          role: StaticText
          nameMatch: normalized
          scope:
            framePath:
              - main
            heading: CONFIRM ACCOUNT HOLD
          anchors:
            - relation: proximateLabel
              text: Reason
            - relation: nearHeading
              text: CONFIRM ACCOUNT HOLD
          hints:
            boundsAtRecord:
              x: 352.265625
              y: 179
              width: 39
              height: 13
            proximateLabels:
              - Reason
        transform: trim
  preconditions:
    authState: authenticated
    describe: An operator session must already exist. Sign-on is the runtime's responsibility, not part
      of this flow.
  steps:
    - id: s1
      intent: Click the 'Member Inquiry / Selection' link to start member search
      action:
        type: click
        target:
          description: Click the 'Member Inquiry / Selection' link to start member search
          role: link
          name: Member Inquiry / Selection
          nameMatch: normalized
          scope:
            framePath:
              - main
            heading: MAIN MENU
          anchors:
            - relation: nearHeading
              text: MAIN MENU
          hints:
            domHint: a
            boundsAtRecord:
              x: 324.875
              y: 125
              width: 151.21875
              height: 13
      guard:
        risk: safe
      checkpoint:
        describe: the route matches /members(?:[?#]|$) and "MEMBER INQUIRY / SELECTION" is on screen
        all:
          - kind: urlMatches
            pattern: /members(?:[?#]|$)
          - kind: textPresent
            text: MEMBER INQUIRY / SELECTION
        any: []
        timeoutMs: 12000
        pollMs: 250
      conditions: []
