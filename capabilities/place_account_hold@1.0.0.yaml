        target:
          description: the Apply Hold control on the CONFIRM ACCOUNT HOLD screen
          role: button
          name: Apply Hold
          nameMatch: normalized
          scope:
            framePath:
              - main
            heading: CONFIRM ACCOUNT HOLD
          anchors:
            - relation: nearHeading
              text: CONFIRM ACCOUNT HOLD
          hints:
            proximateLabels: []
      guard:
        risk: irreversible
        note: Restricts the member from using the share. MERIDIAN labels the review screen IRREVERSIBLE
          ACTION. A teller is refused this outright (SUPERVISOR_OVERRIDE_REQUIRED); a supervisor
          still needs explicit authorisation, or the run stops for a human here.
      checkpoint:
        describe: the hold was applied and the application confirmed it
        all:
          - kind: urlMatches
            pattern: /members/[^/]+/hold/post
        any:
          - kind: textPresent
            text: HOLD APPLIED
          - kind: textPresent
            text: Confirmation
        timeoutMs: 15000
        pollMs: 250
      conditions: []
      optional: false
  successCheckpoint:
    describe: the place account hold was posted and the application confirmed it
    all:
      - kind: urlMatches
        pattern: /members/[^/]+/hold/post
    any:
      - kind: textPresent
        text: HOLD APPLIED
      - kind: textPresent
        text: Confirmation
    timeoutMs: 15000
    pollMs: 250
  outcomes:
    business:
      - code: MEMBER_NOT_FOUND
        meaning: No member record matches the supplied identifier.
        outputsAvailable: false
      - code: SUPERVISOR_OVERRIDE_REQUIRED
        meaning: >
          The signed-on operator is not entitled to perform this restricted function. A supervisor
          must carry it out.
        outputsAvailable: false
      - code: VALIDATION_ERROR
        meaning: The application rejected the submitted transaction.
        outputsAvailable: false
  escalation:
    onUnrecovered: escalate
    onAmbiguous: escalate
    onIrreversible: require_approval
overrides: {}
