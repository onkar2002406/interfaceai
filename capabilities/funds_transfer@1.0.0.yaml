# Post a funds transfer between two shares on a member record
#
# Moves {{amount}} from share {{fromShare}} to share {{toShare}} on member {{memberId}} with the memo {{memo}}, reviewing the transfer and then POSTING it. The posting step is irreversible and requires explicit authorisation; without it the run stops for a human at the confirmation screen having committed nothing.
#
# Reviewed by a human before `approval: approved` is set. Approval is what
# permits unattended replay of any step marked risk: irreversible.
#
# Values below are parameter REFERENCES ({{name}}), never captured data.

apiVersion: capability.interface.ai/v1
kind: Capability
metadata:
  id: cap_funds_transfer
  name: funds_transfer
  version: 1.0.0
  title: Post a funds transfer between two shares on a member record
  summary: Moves {{amount}} from share {{fromShare}} to share {{toShare}} on member {{memberId}} with
    the memo {{memo}}, reviewing the transfer and then POSTING it. The posting step is irreversible
    and requires explicit authorisation; without it the run stops for a human at the confirmation
    screen having committed nothing.
  createdAt: 2026-09-05T13:43:33.223Z
  app:
    product: meridian-core
    productVersion: 4.2.1
    tenant: meridian
    entryPoint: /
  approval: draft
  provenance:
    discoveryRunId: 119cf3e8
    model: groq:openai/gpt-oss-120b
    surfaceKind: web
    traceRef: evidence/runs/discovery-119cf3e8/trace.json
    traceSha256: ff4b273a649ce5db56f8e3264901984dc46a4be45b22ab84fabff9957343cc5b
    handCompleted: "step s10 (Post Transfer) was authored by a person, not recorded: policy refuses
      irreversible actions during discovery, so the agent recorded up to the review screen and
      stopped. See scripts/complete-posting-steps.ts. step s8a (Memo) was authored by a person, not
      recorded: the discovery goal did not mention this field, so the model never typed into it. The
      control is on MERIDIAN's own screen. See scripts/add-form-fields.ts."
spec:
  inputs:
    - name: memberId
      type: string
      description: Enter member number {{memberId}} into the Value textbox for member search.
      required: true
      pattern: ^[0-9]{1,9}$
      sensitivity: pii
    - name: fromShare
      type: string
      description: Select {{fromShare}} in the From Share dropdown.
      required: true
      pattern: ^.{1,40}$
      sensitivity: pii
    - name: toShare
      type: string
      description: Select {{toShare}} in the To Share dropdown.
      required: true
      pattern: ^.{1,40}$
      sensitivity: pii
    - name: amount
      type: string
      description: Enter transfer amount {{amount}} into the Amount textbox.
      required: true
      pattern: ^[0-9]+(\.[0-9]{1,2})?$
      sensitivity: pii
    - name: memo
      type: string
      description: Memo recorded against the transfer, 40 characters or fewer.
      required: true
      pattern: ^.{1,40}$
      sensitivity: pii
  outputs:
    - name: fromShare
      type: string
      description: From share
      sensitivity: pii
      from:
        afterStep: s9
        target:
          description: the fromShare value on the final screen
          role: StaticText
          nameMatch: normalized
          scope:
            framePath:
              - main
            heading: CONFIRM FUNDS TRANSFER
          anchors:
            - relation: proximateLabel
              text: From
            - relation: nearHeading
              text: CONFIRM FUNDS TRANSFER
          hints:
            boundsAtRecord:
              x: 352.265625
              y: 134
              width: 150.90625
              height: 13
            proximateLabels:
              - From
        transform: trim
    - name: toShare
      type: string
      description: To share
      sensitivity: pii
      from:
        afterStep: s9
        target:
          description: the toShare value on the final screen
          role: StaticText
          nameMatch: normalized
          scope:
            framePath:
              - main
            heading: CONFIRM FUNDS TRANSFER
          anchors:
            - relation: proximateLabel
              text: To
            - relation: nearHeading
              text: CONFIRM FUNDS TRANSFER
          hints:
            boundsAtRecord:
              x: 352.265625
              y: 153
              width: 144
              height: 13
            proximateLabels:
              - To
        transform: trim
    - name: transferAmount
      type: money
      description: Transfer amount
      sensitivity: pii
      from:
        afterStep: s9
        target:
          description: the transferAmount value on the final screen
          role: StaticText
          nameMatch: normalized
          scope:
            framePath:
              - main
            heading: CONFIRM FUNDS TRANSFER
          anchors:
            - relation: proximateLabel
              text: Amount
            - relation: nearHeading
              text: CONFIRM FUNDS TRANSFER
          hints:
            boundsAtRecord:
              x: 352.265625
              y: 172
              width: 36
              height: 13
            proximateLabels:
              - Amount
        transform: money
  preconditions:
    authState: authenticated
    describe: An operator session must already exist. Sign-on is the runtime's responsibility, not part
      of this flow.
  steps:
