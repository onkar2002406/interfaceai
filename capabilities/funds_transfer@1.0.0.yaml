              width: 151.21875
              height: 13
      guard:
        risk: safe
      checkpoint:
        describe: the route matches /members(?:[?#]|$) and "MEMBER INQUIRY / SELECTION" is on screen
        all:
          - kind: urlMatches
            pattern: /members(?:[?#]|$)
          - kind: textPresent
            text: MEMBER INQUIRY / SELECTION
        any: []
        timeoutMs: 12000
