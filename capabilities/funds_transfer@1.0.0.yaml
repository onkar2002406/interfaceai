    - id: s10
      intent: Click Post Transfer to commit the transfer shown on the confirmation screen
      action:
        type: click
        target:
          description: the Post Transfer control on the CONFIRM FUNDS TRANSFER screen
          role: button
          name: Post Transfer
          nameMatch: normalized
          scope:
            framePath:
              - main
            heading: CONFIRM FUNDS TRANSFER
          anchors:
            - relation: nearHeading
              text: CONFIRM FUNDS TRANSFER
          hints:
            proximateLabels: []
      guard:
        risk: irreversible
        note: Moves money between two shares. MERIDIAN states on the review screen that this posts
          immediately and cannot be reversed from that screen. Requires explicit authorisation, or
          the run stops for a human here.
      checkpoint:
        describe: the transfer was posted and the application confirmed it
        all:
          - kind: urlMatches
            pattern: /members/[^/]+/transfer/post
        any:
          - kind: textPresent
            text: TRANSFER POSTED
          - kind: textPresent
            text: Confirmation
        timeoutMs: 15000
        pollMs: 250
      conditions: []
      optional: false
  successCheckpoint:
    describe: the funds transfer was posted and the application confirmed it
    all:
      - kind: urlMatches
        pattern: /members/[^/]+/transfer/post
    any:
      - kind: textPresent
        text: TRANSFER POSTED
      - kind: textPresent
        text: Confirmation
    timeoutMs: 15000
    pollMs: 250
  outcomes:
    business:
      - code: MEMBER_NOT_FOUND
        meaning: No member record matches the supplied identifier.
        outputsAvailable: false
      - code: SUPERVISOR_OVERRIDE_REQUIRED
        meaning: >
          The signed-on operator is not entitled to perform this restricted function. A supervisor
          must carry it out.
        outputsAvailable: false
      - code: VALIDATION_ERROR
        meaning: The application rejected the submitted transaction.
        outputsAvailable: false
  escalation:
    onUnrecovered: escalate
    onAmbiguous: escalate
    onIrreversible: require_approval
overrides: {}
