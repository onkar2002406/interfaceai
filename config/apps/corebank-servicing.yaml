product: corebank-servicing
policy: config/policy.json
description: >
  CoreBank Servicing Console — the back-office application staff use to look up
  members, view share accounts, amend a member's contact details and open
  sub-accounts. Deployed to many institutions from the same vendor build,
  configured and branded per institution.

# ---------------------------------------------------------------------------
# The chat front door, for this product's customer base.
#
# CoreBank's caller is a branch or back-office clerk at a small credit union.
# They work member-by-member and talk about MEMBER NUMBERS and SHARE ACCOUNTS,
# and the two flows recorded for them are a savings-balance lookup and opening
# a sub-account.
#
# The identifiers below are real rows in this product's seeded data
# (`apps/corebank/seed-data.ts`). That matters: an opener naming a member who
# does not exist turns a demonstration of the system into a demonstration of a
# model guessing an identifier.
#
# Five openers, covering each arm of the result contract:
#   1. success           — member 10001 has an open Savings share
#   2. business outcome  — 99999 is nobody: MEMBER_NOT_FOUND
#   3. business outcome  — 10007 is `restricted: true`: PERMISSION_DENIED
#   4. escalated         — opening a sub-account ends in an irreversible step,
#                          which chat cannot authorise, so it stops for a human.
#                          CHECKING, because 10002 already holds an open Savings
#                          and the institution permits one account per product —
#                          asking for Savings here would demonstrate the
#                          duplicate refusal instead of the escalation.
#   5. business outcome  — 10002 DOES hold an open Savings: DUPLICATE_ACCOUNT_TYPE,
#                          refused at the review screen, before the irreversible
#                          step is ever presented
# ---------------------------------------------------------------------------
chat:
  audience: >
    Back-office and branch staff at a credit union running the CoreBank
    Servicing Console. They work one member at a time: look a member up by
    member number, read the balance on a share account, amend the contact
    details on file, open a sub-account. Members are identified by a five-digit
    member number; share accounts by a ten-digit account number the console
    prints in full.
  suggestions:
    - What is the savings balance for member 10001?
    - Look up member 99999
    - What is the savings balance for member 10007?
    - Open a Checking sub-account for member 10002 with a $100.00 initial deposit, nicknamed Vacation Fund
    - Open a Savings sub-account for member 10002 with a $100.00 initial deposit, nicknamed Rainy Day

# ---------------------------------------------------------------------------
# Product-wide runtime conditions.
#
# Evaluated after EVERY step of EVERY capability recorded against this product,
# in the order written here. The classifier takes the FIRST match, so the order
# encodes the taxonomy:
#
#   business  -> a legitimate answer the caller asked for
#   recover   -> something we know how to fix, bounded
#   fail      -> something we know is fatal, diagnosed rather than timed out
#
# Authoring these once per product (rather than per capability) is the whole
# point: fixing how we handle a session timeout fixes it for every flow.
# ---------------------------------------------------------------------------
conditions:
  # ---- business outcomes: real answers, not failures ----------------------
  - id: permission_denied
    description: >
      The member record is restricted to higher-privilege staff. Nothing is
      broken — the caller needs to know it cannot see this record.
    when:
      kind: textPresent
      text: You are not authorized to view this record
    then:
      kind: business
      code: PERMISSION_DENIED
      message: The signed-on operator lacks entitlements for this member record.

  - id: member_not_found
    description: >
      No member matches the supplied identifier. The canonical example of an
      outcome that must not be reported as an error.
    when:
      kind: textPresent
      text: No records found
    then:
      kind: business
      code: MEMBER_NOT_FOUND
      message: No member matches the supplied identifier.

  - id: validation_error
    description: >
      The application rejected the submitted form. The caller supplied data the
      business rules refuse, which is information, not a malfunction.
    when:
      kind: textPresent
      text: Please correct the following
    then:
      kind: business
      code: VALIDATION_ERROR
      message: The application rejected the submitted values.

  - id: duplicate_account_type
    description: >
      The member already holds an open account of the requested product, and the
      institution permits one of each. Distinct from validation_error on purpose:
      nothing the caller submitted is malformed, so "fix your input and retry" is
      the wrong advice — the answer is "choose a different product, or this member
      already has what you were asked to create". The app gives it its own wording
      rather than the shared "Please correct the following" banner so the two stay
      separable here.
    when:
      kind: textPresent
      text: already exists for this member
    then:
      kind: business
      code: DUPLICATE_ACCOUNT_TYPE
      message: The member already holds an open account of this type.

  # ---- recoverable conditions: bounded, then re-verified ------------------
  - id: session_expired
    description: >
      The session timed out and the app bounced to sign-on. Recoverable exactly
      once — a second expiry in one run means something is wrong with the
      credentials or the session policy, and retrying would just loop.
    when:
      kind: textPresent
      text: session has expired
    then:
      kind: recover
      action:
        handler: reauthenticate
        maxAttempts: 1

  - id: maintenance_interstitial
    description: >
      An unscheduled maintenance overlay appeared over the page. Note it carries
      no role="dialog" and no aria-label — a legacy app would not bother — so it
      is detected by the text a human would read, which is also the signal that
      works on a screenshot-only or desktop surface.
    when:
      kind: textPresent
      text: Scheduled Maintenance Notice
    then:
      kind: recover
      action:
        handler: dismiss_dialog
        maxAttempts: 2
        dismissTarget:
          description: the Continue button on the maintenance overlay
          role: button
          name: Continue

  # ---- hard failures: diagnosed, not merely timed out --------------------
  - id: app_error
    description: >
      The application returned its error page. Retrying will not help; stop and
      surface the reference so it can be traced in the app's own logs.
    when:
      kind: textPresent
      text: Unexpected System Error
    then:
      kind: fail
      errorClass: surface_error
      message: >
        The application returned its system error page. The on-screen error
        reference identifies the failure in the vendor's logs.

# ---------------------------------------------------------------------------
# How the harness arms this product's runtime faults.
#
# CoreBank is a local app we own, so it can afford the simple mechanism: an
# admin endpoint that arms a fault for the next matching request. The route each
# fault attaches to matters — left untargeted, a session fault fires on
# whichever request arrives first (in practice the sign-on bounce), which tests
# "sign-on is broken" rather than "the session expired mid-flow".
#
# /_admin/** is on the policy DENY list precisely so the automation cannot reach
# its own test hooks. The harness may arm faults; the agent may not.
# ---------------------------------------------------------------------------
faults:
  strategy: admin_endpoint
  path: /_admin/fault
  routes:
    slow: /member/*
    app_error: /member/*
    session: /member/*
    interstitial: /search

# ---------------------------------------------------------------------------
# Re-authentication. Field targets only — credentials come from the environment
# at run time and are never written to disk or into an artifact.
# ---------------------------------------------------------------------------
auth:
  loginPath: /login
  credentialEnv:
    user: COREBANK_OPERATOR
    password: COREBANK_PASSWORD

  operatorField:
    description: the Operator ID box on the sign-on screen
    role: textbox
    anchors:
      - relation: proximateLabel
        text: Operator ID

  passwordField:
    description: the Password box on the sign-on screen
    role: textbox
    anchors:
      - relation: proximateLabel
        text: Password

  submitTarget:
    description: the Sign On button
    role: button
    name: Sign On

  successCheckpoint:
    describe: the sign-on screen is no longer displayed
    all:
      - kind: textAbsent
        text: Staff Sign On
    timeoutMs: 8000

# ---------------------------------------------------------------------------
# Tenants. Same vendor product, different install. Adding an institution is a
# config entry — not a re-recording, and not an engineering project.
# ---------------------------------------------------------------------------
tenants:
  - id: base
    label: CoreBank Reference Install
    baseUrl: http://localhost:4000
    productVersion: '8.2'

  - id: firstvalley
    label: First Valley Credit Union
    baseUrl: http://localhost:4001
    productVersion: '8.2'
    # Its own staff directory, so its own operator. Names only — the values are
    # supplied by the environment at run time.
    credentialEnv:
      user: COREBANK_OPERATOR_FIRSTVALLEY
      password: COREBANK_PASSWORD_FIRSTVALLEY

  - id: harborcu
    label: Harbor Credit Union
    baseUrl: http://localhost:4002
    productVersion: '9.0'
    credentialEnv:
      user: COREBANK_OPERATOR_HARBORCU
      password: COREBANK_PASSWORD_HARBORCU
    extraConditions:
      - id: privacy_acknowledgement
        description: >
          Harbor's compliance team added a mandatory privacy acknowledgement
          before member detail. It is specific to this institution, so it lives
          on the tenant rather than in the product profile — capabilities
          recorded elsewhere inherit it automatically when replayed here.
        when:
          kind: textPresent
          text: Privacy Acknowledgement Required
        then:
          kind: recover
          action:
            handler: dismiss_dialog
            maxAttempts: 1
            dismissTarget:
              description: the Acknowledge and Continue button
              role: button
              name: Acknowledge and Continue
